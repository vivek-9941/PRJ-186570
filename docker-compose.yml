version: "3.9"

services:
  # ─── Infrastructure ────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trade-executed --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trade-executed.DLT --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-cancelled --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-cancelled.DLT --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-expired --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-expired.DLT --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic market-data --partitions 4 --replication-factor 1

  # ─── gRPC Services ─────────────────────────────────────────────
  risk-service:
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    container_name: risk-service
    ports:
      - "9091:9091"
    environment:
      GRPC_SERVER_PORT: 9091
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  margin-service:
    build:
      context: .
      dockerfile: margin-service/Dockerfile
    container_name: margin-service
    ports:
      - "9092:9092"
    environment:
      GRPC_SERVER_PORT: 9092
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  compliance-service:
    build:
      context: .
      dockerfile: compliance-service/Dockerfile
    container_name: compliance-service
    ports:
      - "9093:9093"
    environment:
      GRPC_SERVER_PORT: 9093
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  # ─── Matching Engine ────────────────────────────────────────────
  matching-engine:
    build:
      context: .
      dockerfile: matching-engine/Dockerfile
    container_name: matching-engine
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  # ─── Market Data Service ───────────────────────────────────────
  market-data-service:
    build:
      context: .
      dockerfile: market-data-service/Dockerfile
    container_name: market-data-service
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  # ─── Order Service ──────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      risk-service:
        condition: service_started
      margin-service:
        condition: service_started
      compliance-service:
        condition: service_started
      matching-engine:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      RISK_HOST: ${RISK_HOST}
      MARGIN_HOST: ${MARGIN_HOST}
      COMPLIANCE_HOST: ${COMPLIANCE_HOST}
      MATCHING_ENGINE_HOST: ${MATCHING_ENGINE_HOST}

networks:
  default:
    name: trade-network
