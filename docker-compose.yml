version: "3.9"

services:
  # ─── Infrastructure ────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─── gRPC Services ─────────────────────────────────────────────
  risk-service:
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    container_name: risk-service
    ports:
      - "9091:9091"
    environment:
      GRPC_SERVER_PORT: 9091
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  margin-service:
    build:
      context: .
      dockerfile: margin-service/Dockerfile
    container_name: margin-service
    ports:
      - "9092:9092"
    environment:
      GRPC_SERVER_PORT: 9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  compliance-service:
    build:
      context: .
      dockerfile: compliance-service/Dockerfile
    container_name: compliance-service
    ports:
      - "9093:9093"
    environment:
      GRPC_SERVER_PORT: 9093
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  # ─── Matching Engine ────────────────────────────────────────────
  matching-engine:
    build:
      context: .
      dockerfile: matching-engine/Dockerfile
    container_name: matching-engine
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  # ─── Order Service ──────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      risk-service:
        condition: service_started
      margin-service:
        condition: service_started
      compliance-service:
        condition: service_started
      matching-engine:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_RISK_HOST: risk-service
      GRPC_RISK_PORT: 9091
      GRPC_MARGIN_HOST: margin-service
      GRPC_MARGIN_PORT: 9092
      GRPC_COMPLIANCE_HOST: compliance-service
      GRPC_COMPLIANCE_PORT: 9093

networks:
  default:
    name: trade-network
